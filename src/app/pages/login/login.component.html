<div class="login-wrapper">
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg>
      </div>
      <h1 class="brand-title">TALLER <span>PRO</span></h1>
      <p class="brand-subtitle">Gestión Integral de Taller Mecánico</p>
    </div>

    <!-- Formulario vinculado -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <!-- Mensaje de error si falla la API -->
      <div *ngIf="errorMensaje" class="error-banner">
        {{ errorMensaje }}
      </div>

      <div class="form-group">
        <label for="email">Usuario o Correo</label>
        <div class="input-container">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input type="email" id="email" formControlName="email" placeholder="ej. admin@taller.com" />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
          <a href="#" class="forgot-link">¿Olvidaste tu clave?</a>
        </div>
        <div class="input-container">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" formControlName="password" placeholder="••••••••••••" />
        </div>
      </div>

      <button type="submit" [disabled]="cargando" class="btn-login">
        <span>{{ cargando ? 'Iniciando sesión...' : 'Ingresar al Sistema' }}</span>
        <svg *ngIf="!cargando" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="login-footer">
      <p>&copy; 2026 TallerPro. Todos los derechos reservados.</p>
    </div>
  </div>
</div>
